<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact – Global Cambodia Youth Network</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="wrap">
      <a class="brand" href="index.html"><span class="mark"><img src="logo.png" alt="logo"></span> GLOBAL CAMBODIA YOUTH NETWORK</a>
      <div class="nav-btns"><a href="index.html">HOME</a><a href="about.html">ABOUT US</a><a href="team.html">TEAM</a><a href="contact.html" class="active">CONTACT</a><a href="join.html">JOIN US</a><a href="donate.html">DONATE</a><a href="news.html">NEWSLETTER</a></div>
    </div></header><section class="contact" id="contact">
    <div class="wrap">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <div>
          <label for="name">Person Name</label>
          <input id="name" type="text" required>
        </div>
        <div>
          <label for="country">Person Country</label>
          <input id="country" type="text" required>
        </div>
        <div>
          <label for="phone">Person Phone Number</label>
          <input id="phone" type="tel">
        </div>
        <div>
          <label for="email">Person Email</label>
          <input id="email" type="email" required>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" rows="4"></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>
  <footer>© 2026 Global Cambodia Youth Network</footer>
  <script src="script.js"></script>
</body>
</html>
